gradle = "5.4.1"
actionlint = "1.7.12"
pinact = "5.0.0"
zizmor = "1.30.1"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.50.3"
rumdl = "0.2.78"
biome = "2.5.10"
tombi = "1.7.1"
"github:owenlamont/ryl" = "0.22.0"
